<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MoneyMate — Split Smarter, Settle Faster</title>
    
    <!-- PWA / Mobile Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoneyMate" />
    <meta name="theme-color" content="#0B0B16" />

    <!-- Apply the saved theme before first paint. Without this the page renders
         in the OS theme for a frame and then snaps to the saved one. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('moneymate.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', saved === 'light' ? '#F5F6FB' : '#0B0B16');
          }
        } catch (e) {
          /* storage unavailable — fall through to the OS preference */
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
